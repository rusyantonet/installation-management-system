<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2327;--mut:#6b767c;--bg:#f3f4f1;--card:#fff;--line:#dfe2dc;--side:#22292e;--amber:#e8a317;--amberd:#b87d00;--ok:#2e8b57;--okbg:#e3f3ea;--pend:#b45309;--pendbg:#fdf0dc;--bad:#c0392b;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Semi Condensed',Barlow,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hide{display:none!important}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--side)}
.lbox{width:100%;max-width:380px;background:var(--card);border-radius:14px;padding:28px;border-top:6px solid var(--amber)}
.lbox h1{font-size:26px;margin-bottom:4px}.lbox p{color:var(--mut);margin:0 0 18px}

/* layout */
#app{display:flex;min-height:100vh}
#side{width:250px;background:var(--side);color:#e9ecea;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;transition:transform .2s}
.brand{padding:20px 20px 14px;border-bottom:1px solid #38424a}
.brand b{display:block;font:700 20px 'Barlow Semi Condensed',sans-serif;color:var(--amber)}
.brand span{font-size:13px;color:#9fa9ae}
#menu{padding:10px;flex:1;overflow:auto}
#menu button{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;margin-bottom:2px;background:none;border:0;border-radius:8px;color:#d3d9d6;text-align:left;cursor:pointer}
#menu button:hover{background:#2e373d}
#menu button.on{background:var(--amber);color:#1d2327;font-weight:600}
.me{padding:14px 20px;border-top:1px solid #38424a;font-size:14px}
.me small{color:#9fa9ae;display:block}
.me button{margin-top:8px;background:none;border:1px solid #4b5760;color:#e9ecea;border-radius:8px;padding:6px 12px;cursor:pointer}
#content{margin-left:250px;flex:1;min-width:0}
#top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
#top h2{font-size:22px}
#burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:42px;height:42px;font-size:20px;cursor:pointer}
#main{padding:24px;max-width:1200px}
#scrim{display:none}
@media(max-width:900px){
 #side{transform:translateX(-100%)}#side.open{transform:none}
 #scrim.open{display:block;position:fixed;inset:0;background:#0007;z-index:25}
 #content{margin-left:0}#burger{display:block}#top{padding:10px 14px}#main{padding:14px}
}

/* komponen */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat b{display:block;font:700 34px/1.1 'Barlow Semi Condensed',sans-serif}.stat span{color:var(--mut)}
.stat.big{background:var(--side);color:#fff;border-color:var(--side)}.stat.big span{color:#b8c1c5}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar .inp{flex:1;min-width:180px}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border:1px solid #c5cac2;border-radius:8px;background:#fff}
textarea.inp{min-height:84px;resize:vertical}
label.f{display:block;margin-bottom:12px;font-weight:500}label.f .inp{margin-top:5px;font-weight:400}
.btn{border:1px solid #c5cac2;background:#fff;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1d2327;font-weight:600}.btn.pri:hover{background:#f2b434}
.btn.dng{color:var(--bad);border-color:#e3b8b3}.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tw{overflow-x:auto;padding:0}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f7f8f5;font-weight:600;font-size:14px;color:var(--mut)}
tr:last-child td{border-bottom:0}.acts{white-space:nowrap;text-align:right}.acts .btn{margin-left:6px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.b-ok{background:var(--okbg);color:var(--ok)}.b-pend{background:var(--pendbg);color:var(--pend)}.b-off{background:#eceeea;color:var(--mut)}
.prog{height:10px;background:#e7eae4;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prow{display:grid;grid-template-columns:140px 1fr 70px;gap:12px;align-items:center;margin:9px 0}
.prow span:last-child{text-align:right;color:var(--mut);font-size:14px}
@media(max-width:560px){.prow{grid-template-columns:100px 1fr 56px}}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.loading{padding:40px;text-align:center;color:var(--mut)}

/* form instalasi */
.dev .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:600 18px 'Barlow Semi Condensed',sans-serif}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px;border:2px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on[data-s=Installed]{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.seg button.on[data-s=Pending]{border-color:var(--pend);background:var(--pendbg);color:var(--pend)}
.extra{display:none;margin-top:12px}.dev[data-st=Installed] .extra{display:block}
.photo{display:flex;gap:12px;align-items:center;margin-top:10px}
.photo label{cursor:pointer}.photo img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photo small{color:var(--mut)}
.stick{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;margin-top:6px}
.stick .btn{width:100%;padding:14px;font-size:17px}
.note{background:var(--pendbg);color:var(--pend);padding:10px 12px;border-radius:8px;margin-top:4px}

/* kartu data instalasi */
.ic{display:flex;flex-direction:column;gap:8px;margin:0}.ic h3{font-size:22px}.ic .m{color:var(--mut);font-size:14px}
.ic .row{display:flex;justify-content:space-between;align-items:center;gap:8px}

.hi{margin-bottom:10px}.hi .row{display:flex;justify-content:space-between;gap:8px;align-items:center}.hi .m{color:var(--mut);font-size:14px}.hi .sn{margin-top:4px}
a.btn{display:inline-block;text-decoration:none;text-align:center}.note2{color:var(--mut);font-size:14px;margin:4px 0 14px}
/* modal & toast */
.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.md{background:#fff;border-radius:14px;width:100%;max-width:560px;padding:22px;margin:auto}
.md.wide{max-width:760px}.md h3{font-size:22px;margin-bottom:14px}.md .ft{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:14px}
.chk{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:500}.chk input{width:20px;height:20px;accent-color:var(--amberd)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;z-index:99;max-width:92vw}
#toast.err{background:var(--bad)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="lf">
    <h1>Installation Management System</h1>
    <p>Masuk dengan akun Anda.</p>
    <label class="f">Username<input class="inp" id="lu" autocomplete="username" required></label>
    <label class="f">Password<input class="inp" id="lp" type="password" autocomplete="current-password" required></label>
    <button class="btn pri" style="width:100%;padding:12px" id="lb">Masuk</button>
  </form>
</div>

<div id="app" class="hide">
  <aside id="side">
    <div class="brand"><b>Installation Management System</b><span>MineSafeDrive - Freeport</span></div>
    <nav id="menu"></nav>
    <div class="me"><b id="mn"></b><small id="mr"></small><button id="lo">Keluar</button></div>
  </aside>
  <div id="scrim"></div>
  <div id="content">
    <header id="top"><button id="burger" aria-label="Buka menu">&#9776;</button><h2 id="title"></h2></header>
    <main id="main"></main>
  </div>
</div>
<div id="toast" class="hide"></div>
<div id="diag" style="display:none;position:fixed;left:0;right:0;top:0;z-index:999;background:#c0392b;color:#fff;padding:10px 14px;font:14px monospace"></div>
<script>window.onerror=function(m,s,l){var d=document.getElementById('diag');d.style.display='block';d.textContent='Error JS: '+m+' (baris '+l+')';};</script>
